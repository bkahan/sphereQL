# Single source of truth for corpus generation + validation parameters.
# Every value here was a hardcoded constant in tools/*.py before Phase 1.
# Override at the CLI with --config /path/to/override.toml or per-key
# --set generation.min_features=3.

[generation]
num_axes = 128
min_features = 4
max_features = 8
n_features_min = 5         # generate_extended.py: "5 + (label_hash % 3)" → min 5
n_features_max = 7         # generate_extended.py: → max 7 (5+2)
weight_floor = 0.2
weight_ceiling = 1.0
weight_jitter_range = 0.1  # ±0.05 about base
weight_round_decimals = 1
primary_seed_hits = 100    # generate_extended.py:227

# Per-rank weight curve. Index 0..N-1 corresponds to rank 0..N-1.
# The last entry applies to all ranks ≥ N-1 (current behavior: rank 4+).
# weight = base + 0.2 * min(hit_count / divisor, 1.0) + jitter
[[generation.weight_curve]]
base = 0.8
divisor = 4.0

[[generation.weight_curve]]
base = 0.6
divisor = 3.0

[[generation.weight_curve]]
base = 0.4
divisor = 2.0

[[generation.weight_curve]]
base = 0.4
divisor = 2.0

[[generation.weight_curve]]
base = 0.3
divisor = 2.0

[validation]
min_total_concepts = 5000
min_per_category = 50
warn_thin_category = 80
min_mean_features = 4.5
max_mean_features = 7.0
min_bridge_ratio = 0.75
max_misrouted_ratio = 0.05

[http]
timeout_seconds = 60
per_page = 100
inter_page_sleep_seconds = 0.1
retries = 3
backoff_base = 1.0
backoff_multiplier = 2.0

[output]
path = "../data/extended_corpus.json"
# Phase 3: Parquet artifact is the primary read path in Rust.
parquet_path = "../data/extended_corpus.parquet"

# Phase 5: weights for sphereql_embed::CorpusQuality. The metric fuses
# four sub-scores into a single tuner objective:
#   composite = (w_evr * EVR
#              + w_bridge * bridge_coherence
#              + w_curvature * curvature_health
#              + w_balance * category_balance) / sum(weights)
# Weights must be non-negative and not all zero; they do NOT need to
# sum to 1 — the metric normalizes by their sum at score time. Phase 6
# is the consumer that wires these into the Rust tuner; Phase 5 only
# requires the config schema to exist.
[quality_metric]
w_evr = 0.30
w_bridge = 0.30
w_curvature = 0.20
w_balance = 0.20

# Phase 6: self-tuning loop parameters. The Rust binary
# `cargo run -p sphereql-embed --example corpus_self_tune` reads the
# canonical corpus, runs `run_self_tune` with these defaults, and writes
# back to `*.tuned.parquet` (or in-place with --commit --commit-confirm).
#
# Reweight multipliers compose as
#   quality *= bridge_factor
#            * curvature_factor
#            * (home_smooth + (1 - home_smooth) * home_affinity)
#            * (source_smooth + (1 - source_smooth) * source_confidence)
# clamped to [0, 1]. Pruning is greedy below `min_quality_to_keep` and
# never drops a category below `min_concepts_per_category`.
[self_tune]
max_iterations = 10
plateau_epsilon = 0.001
min_quality_to_keep = 0.3
min_concepts_per_category = 50
bridge_genuine_boost = 1.05
bridge_artifact_penalty = 0.85
curvature_outlier_penalty = 0.9
curvature_z_threshold = 1.5
home_affinity_smoothing = 0.5
source_confidence_smoothing = 0.8

# Phase 7: softened self-tune defaults for bulk-ingested corpora.
# Hashed-claim axes are noisier than the hand-curated 5K corpus, so
# `min_quality_to_keep=0.3` would prune most of a 500K bulk corpus on
# iteration one. These looser thresholds let the tuner reshape weights
# without destroying scale; bump them up once the corpus stabilizes.
[self_tune_bulk]
max_iterations = 8
plateau_epsilon = 0.0005
min_quality_to_keep = 0.15
min_concepts_per_category = 30

# Phase 7: streaming bulk ingest. The Rust binary
# `cargo run -p sphereql-corpus --example bulk_ingest` reads its CLI
# args from this table via `tools/run_bulk_ingest.py`, then streams a
# BulkSource through HashedClaimAxisExtractor and writes a Parquet
# corpus at `target_size`. Defaults target ~500K Wikidata items; switch
# `source` to scale up.
[bulk]
# Active source. One of "wikidata_sparql" (5K–1M), "openalex_shard"
# (1M–50M), "wikidata_dump" (50M–500M).
source = "wikidata_sparql"
# Where the streamed Parquet lands. `*.checkpoint.json` sits next to it.
output = "../data/bulk_corpus.parquet"
# Number of items the source should yield before stopping.
target_size = 500_000
# Hashed claim axes. 128 matches `sphereql_corpus::DIM` — leave alone
# unless you're experimenting with a smaller embedding spectrum.
num_axes = 128
# FNV-1a seed for axis hashing. Hold this stable so the same
# (predicate, object) pair lands on the same axis across runs.
axis_seed = 0xDEADBEEF
# Rows per Parquet flush. Matches the non-streaming writer; raise for
# fewer row groups on fat boxes, lower if memory is tight.
batch_size = 10_000
# Resume from the sibling checkpoint sidecar if present (skip the
# source's first `source_offset` items). The output Parquet is
# rewritten from scratch — checkpointed resume is for the *source*
# pointer, not the output file.
resume = false

[bulk.wikidata_sparql]
endpoint = "https://query.wikidata.org/sparql"
page_size = 500
inter_page_sleep_ms = 250
timeout_seconds = 60
retries = 3

[bulk.openalex_shard]
# Directory the user populated via `aws s3 sync s3://openalex/data/works/`.
shard_dir = "/tmp/openalex_shards"
min_cited_by = 5
min_year = 2010

[bulk.wikidata_dump]
# Local path to the bz2-compressed JSON dump.
dump_path = "/tmp/latest-all.json.bz2"
only_items = true
require_english_label = true

[bulk.dbpedia]
# Directory holding the three DBpedia .ttl.bz2 files
# (instance-types_lang=en, mappingbased-objects_lang=en, labels_lang=en).
# Total compressed size ~1 GB — the right source when you want
# Wikipedia-breadth coverage without the 140 GB Wikidata dump.
dir = "/tmp/dbpedia"
# Working-set multiplier on bulk.target_size; we keep this many
# entities in memory before filtering for label + non-empty claims.
oversample = 4

# Phase 7: emergent clustering. After a bulk ingest writes raw
# (uncategorized) concepts, `tools/cluster_bulk.py` runs
# MiniBatchKMeans on the sparse 128-axis feature vectors and
# overwrites the `category` column with the assigned cluster label.
# This replaces the fixed 31-category whitelist with categories that
# fall out of the actual data — same shape, but the boundaries are
# learned not authored.
[cluster]
k = 64                       # initial cluster count; below
                             # `min_size_per_cluster` triggers shrink
                             # (see `auto_merge`).
batch_size = 4_096           # MiniBatchKMeans batch
max_iter = 200
n_init = 3                   # restarts for best-inertia selection
random_seed = 42             # determinism across runs
min_size_per_cluster = 50    # any smaller and we merge into nearest
auto_merge = true            # post-cluster fold of underweight bins
# Sampling for the centroid fit at very large scale. The full corpus
# is still assigned to centroids; only the *fit* uses a sample. 0 =
# fit on full corpus (default ≤ 5M; raise for 50M+).
sample_size = 0
# Top axes / concepts to surface per cluster in the JSON sidecar.
top_axes_per_cluster = 6
top_concepts_per_cluster = 5
