[package]
name = "check-doc-snippets"
description = "CI drift check: compile-checks the ```rust fenced code blocks in the prose docs against the built sphereql crate, so API drift in a doc snippet (e.g. a fit that now returns Result) fails CI instead of silently rotting"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "check-doc-snippets"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
