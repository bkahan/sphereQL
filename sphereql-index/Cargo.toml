[package]
name = "sphereql-index"
description = "Spatial indexing and queries for sphereQL"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["spherical", "spatial-index", "knn", "geometry", "query"]
categories = ["data-structures", "mathematics"]

[dependencies]
sphereql-core = { version = "0.2.0-alpha", path = "../sphereql-core" }
thiserror = "2"
# O(1) move-to-back for the LRU cache. `IndexMap` keeps insertion
# order and supports `shift_remove` + re-insert at tail in amortized
# constant time, replacing the previous `HashMap + VecDeque` pair
# whose `touch_lru` was O(capacity) per hit.
indexmap = "2"

[dev-dependencies]
proptest = "1"
approx = "0.5"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "index_benchmarks"
harness = false
