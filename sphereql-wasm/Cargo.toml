[package]
name = "sphereql-wasm"
description = "WebAssembly bindings for the sphereql-embed pipeline"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[package.metadata.wasm-pack.profile.release]
# Run wasm-opt with `-Oz` (size) and signpost-stripping. Cuts the
# release bundle ~30–40 % vs. raw wasm-bindgen output. Re-enabled in
# Phase 4 — was off during early iteration so panics surfaced cleanly.
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Toggle in `wasm-pack build --features debug` for development. Pulls
# in `console_error_panic_hook` so panics get a JS stack trace instead
# of a silent unreachable trap. Off by default — release builds are
# panic = abort, console hook adds ~10 KB and isn't useful there.
default = ["scene", "lingua"]
debug = ["dep:console_error_panic_hook"]
# `scene` exposes Pipeline.buildSceneJson (maps the fitted pipeline into a
# sphereql-vis Scene). `lingua` adds LinguaStudio (free text → concept graph →
# Scene) and pulls in `scene` for the Scene type. Both default-on so
# `cargo --all-features` and the wasm jobs build them.
scene = ["dep:sphereql-vis"]
lingua = ["dep:sphereql-lingua", "scene"]

[dependencies]
sphereql-core = { path = "../sphereql-core" }
sphereql-index = { path = "../sphereql-index" }
sphereql-embed = { path = "../sphereql-embed" }
sphereql-vis = { path = "../sphereql-vis", version = "0.3.0", optional = true }
sphereql-lingua = { path = "../sphereql-lingua", version = "0.3.0", optional = true }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
# `tsify` + `serde-wasm-bindgen` give the WASM surface typed TypeScript
# interfaces for every return shape instead of opaque JSON `string`s.
# The `js` feature routes values through `serde-wasm-bindgen` for a
# direct JS-object handoff (no JSON round-trip).
tsify = { version = "0.5", default-features = false, features = ["js"] }
serde-wasm-bindgen = "0.6"
# Tiny bump-allocator — replaces wee_alloc (unmaintained) for ~6 KB
# release bundle savings vs. dlmalloc. Only wired up under
# `cfg(target_arch = "wasm32")` in lib.rs so cargo test on host still
# uses the system allocator.
lol_alloc = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Native-only, used by the `build_studio` example to bake the default 775-point
# demo scene (auto-tuned HandCrafted corpus). Dev-deps are not compiled into
# the wasm cdylib, so they don't affect the shipped bundle.
sphereql-examples = { path = "../sphereql-examples" }
sphereql-corpus = { path = "../sphereql-corpus" }
