[package]
name = "sphereql-core"
description = "Pure spherical math primitives for sphereQL"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["spherical", "geometry", "spatial", "math", "coordinates"]
categories = ["mathematics", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
approx = "0.5"
# Data parallelism for O(n²) pairwise scans (pairwise_overlaps,
# curvature_signature). Stays out of the trig-only hot paths.
rayon = { workspace = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
harness = false
