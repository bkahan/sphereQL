[package]
name = "sphereql"
description = "Project high-dimensional embeddings onto a 3D sphere for semantic search, category enrichment, and visualization"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
default = ["core"]
core = ["dep:sphereql-core"]
index = ["core", "dep:sphereql-index"]
layout = ["index", "dep:sphereql-layout"]
embed = ["layout", "dep:sphereql-embed"]
graphql = ["index", "dep:sphereql-graphql"]
vectordb = ["embed", "dep:sphereql-vectordb"]
pinecone = ["vectordb", "sphereql-vectordb/pinecone"]
retain-embeddings = ["sphereql-embed/retain-embeddings"]
full = ["core", "index", "layout", "embed", "graphql", "vectordb", "retain-embeddings"]

[dependencies]
sphereql-core = { version = "0.2.0-alpha", path = "../sphereql-core", optional = true }
sphereql-index = { version = "0.2.0-alpha", path = "../sphereql-index", optional = true }
sphereql-layout = { version = "0.2.0-alpha", path = "../sphereql-layout", optional = true }
sphereql-embed = { version = "0.2.0-alpha", path = "../sphereql-embed", optional = true }
sphereql-graphql = { version = "0.2.0-alpha", path = "../sphereql-graphql", optional = true }
sphereql-vectordb = { version = "0.2.0-alpha", path = "../sphereql-vectordb", optional = true }
